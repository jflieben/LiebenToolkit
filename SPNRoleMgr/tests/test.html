<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SPNRoleMgr - tests</title>
  <style>
    body { font: 14px/1.4 -apple-system,Segoe UI,sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
    .pass { color: #1f7a3a; } .fail { color: #b32026; font-weight: bold; }
    pre { background: #f4f4f6; padding: 10px; border-radius: 6px; overflow: auto; }
    h1 { font-size: 18px; }
  </style>
</head>
<body>
  <h1>SPNRoleMgr - unit tests for pure helpers</h1>
  <div id="out"></div>
  <script src="../../shared/log.js"></script>
  <script src="../../shared/http.js"></script>
  <script src="../../shared/auth.js"></script>
  <script src="../src/spns.js"></script>
  <script>
    // Tiny test harness. No build step.
    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    function test(name, fn) {
      try {
        fn();
        out.insertAdjacentHTML('beforeend', `<div class="pass">PASS ${name}</div>`);
        pass++;
      } catch (e) {
        out.insertAdjacentHTML('beforeend', `<div class="fail">FAIL ${name}<br><pre>${e.stack || e.message}</pre></div>`);
        fail++;
      }
    }
    function eq(a, b, msg = '') {
      const A = JSON.stringify(a), B = JSON.stringify(b);
      if (A !== B) throw new Error(`${msg} expected ${B}, got ${A}`);
    }

    // classifySpn
    test('classifySpn: Microsoft first-party', () => {
      eq(Spns.classifySpn({ servicePrincipalType: 'Application', appOwnerOrganizationId: Spns.MS_FIRST_PARTY_TENANT }), 'Microsoft first-party');
    });
    test('classifySpn: User-assigned managed identity', () => {
      eq(Spns.classifySpn({ servicePrincipalType: 'ManagedIdentity', tags: ['UserAssigned,MSI'] }), 'Managed identity (user-assigned)');
    });
    test('classifySpn: System-assigned managed identity', () => {
      eq(Spns.classifySpn({ servicePrincipalType: 'ManagedIdentity', tags: [] }), 'Managed identity (system-assigned)');
    });
    test('classifySpn: Application fallback', () => {
      eq(Spns.classifySpn({ servicePrincipalType: 'Application', appOwnerOrganizationId: 'tenant-x' }), 'Application');
    });

    // buildPermissionIndex
    test('buildPermissionIndex: maps appRoles + scopes', () => {
      const sp = {
        appRoles: [{ id: 'r1', value: 'User.Read.All', displayName: 'Read users', description: 'desc' }],
        oauth2PermissionScopes: [{ id: 's1', value: 'Mail.Read', adminConsentDisplayName: 'Read mail', adminConsentDescription: 'desc2' }],
      };
      const idx = Spns.buildPermissionIndex(sp);
      eq(idx.get('r1').type, 'AppRole');
      eq(idx.get('r1').name, 'User.Read.All');
      eq(idx.get('s1').type, 'OAuth2');
      eq(idx.get('s1').name, 'Mail.Read');
    });
    test('buildPermissionIndex: handles null SPN', () => {
      eq(Spns.buildPermissionIndex(null).size, 0);
    });

    // parseScopeString / joinScopeString
    test('parseScopeString: splits and trims', () => {
      eq(Spns.parseScopeString('  Mail.Read   User.Read  '), ['Mail.Read', 'User.Read']);
      eq(Spns.parseScopeString(''), []);
      eq(Spns.parseScopeString(null), []);
    });
    test('joinScopeString: dedupes and trims', () => {
      eq(Spns.joinScopeString(['Mail.Read', ' User.Read ', 'Mail.Read']), 'Mail.Read User.Read');
    });

    test('summarizePermissionRemoval: counts app roles, grants and delegated scopes', () => {
      const summary = Spns.summarizePermissionRemoval(
        [{ id: 'a1' }, { id: 'a2' }],
        [{ id: 'g1', scope: 'Mail.Read User.Read' }, { id: 'g2', scope: 'Files.Read' }]
      );
      eq(summary.appRoleCount, 2);
      eq(summary.grantCount, 2);
      eq(summary.delegatedScopeCount, 3);
      eq(summary.totalPermissionEntries, 4);
    });

    // isMicrosoftFirstParty
    test('isMicrosoftFirstParty: matches the well-known tenant id', () => {
      eq(Spns.isMicrosoftFirstParty({ appOwnerOrganizationId: Spns.MS_FIRST_PARTY_TENANT }), true);
      eq(Spns.isMicrosoftFirstParty({ appOwnerOrganizationId: 'other' }), false);
      eq(Spns.isMicrosoftFirstParty(null), false);
    });

    // assignable permission helpers
    test('hasAssignableAppRoles: only enabled app roles assignable to Application', () => {
      const sp = {
        appRoles: [
          { id: '1', isEnabled: true, allowedMemberTypes: ['Application'] },
          { id: '2', isEnabled: true, allowedMemberTypes: ['User'] },
        ],
      };
      eq(Spns.hasAssignableAppRoles(sp), true);
      eq(Spns.hasAssignableAppRoles({ appRoles: [{ isEnabled: true, allowedMemberTypes: ['User'] }] }), false);
    });
    test('hasAssignableDelegatedScopes: only enabled delegated scopes count', () => {
      eq(Spns.hasAssignableDelegatedScopes({ oauth2PermissionScopes: [{ id: 's1', isEnabled: true }] }), true);
      eq(Spns.hasAssignableDelegatedScopes({ oauth2PermissionScopes: [{ id: 's2', isEnabled: false }] }), false);
      eq(Spns.hasAssignableDelegatedScopes(null), false);
    });
    test('hasAssignablePermissions: true when either app role or scope is assignable', () => {
      eq(Spns.hasAssignablePermissions({ appRoles: [{ isEnabled: true, allowedMemberTypes: ['Application'] }], oauth2PermissionScopes: [] }), true);
      eq(Spns.hasAssignablePermissions({ appRoles: [], oauth2PermissionScopes: [{ isEnabled: true }] }), true);
      eq(Spns.hasAssignablePermissions({ appRoles: [{ isEnabled: true, allowedMemberTypes: ['User'] }], oauth2PermissionScopes: [{ isEnabled: false }] }), false);
    });

    // Sites.Selected detection
    test('hasSitesSelected: true for Sites.Selected on Microsoft Graph', () => {
      const resourceCache = new Map([['res-graph', { appId: Spns.GRAPH_APP_ID }]]);
      const idx = new Map([['role-1', { name: 'Sites.Selected' }]]);
      const resourceIndexCache = new Map([['res-graph', idx]]);
      const appRoles = [{ resourceId: 'res-graph', appRoleId: 'role-1' }];
      eq(Spns.hasSitesSelected(appRoles, resourceCache, resourceIndexCache), true);
    });
    test('hasSitesSelected: true for Sites.Selected on SharePoint Online', () => {
      const resourceCache = new Map([['res-spo', { appId: Spns.SPO_APP_ID }]]);
      const idx = new Map([['role-x', { name: 'Sites.Selected' }]]);
      const resourceIndexCache = new Map([['res-spo', idx]]);
      const appRoles = [{ resourceId: 'res-spo', appRoleId: 'role-x' }];
      eq(Spns.hasSitesSelected(appRoles, resourceCache, resourceIndexCache), true);
    });
    test('hasSitesSelected: false when Sites.Selected is on some other API', () => {
      const resourceCache = new Map([['res-other', { appId: 'some-other-app-id' }]]);
      const idx = new Map([['role-1', { name: 'Sites.Selected' }]]);
      const resourceIndexCache = new Map([['res-other', idx]]);
      const appRoles = [{ resourceId: 'res-other', appRoleId: 'role-1' }];
      eq(Spns.hasSitesSelected(appRoles, resourceCache, resourceIndexCache), false);
    });
    test('hasSitesSelected: false for a different Graph role', () => {
      const resourceCache = new Map([['res-graph', { appId: Spns.GRAPH_APP_ID }]]);
      const idx = new Map([['role-1', { name: 'Sites.ReadWrite.All' }]]);
      const resourceIndexCache = new Map([['res-graph', idx]]);
      const appRoles = [{ resourceId: 'res-graph', appRoleId: 'role-1' }];
      eq(Spns.hasSitesSelected(appRoles, resourceCache, resourceIndexCache), false);
    });
    test('hasSitesSelected: safe on empty / missing inputs', () => {
      eq(Spns.hasSitesSelected(null, null, null), false);
      eq(Spns.hasSitesSelected([], new Map(), new Map()), false);
    });

    // Site permission normalization
    test('extractSiteAppPermissions: flattens grantedToIdentitiesV2', () => {
      const perms = [
        { id: 'p1', roles: ['read'], grantedToIdentitiesV2: [{ application: { id: 'app-1', displayName: 'App One' } }] },
        { id: 'p2', roles: ['write', 'read'], grantedToIdentitiesV2: [{ application: { id: 'app-2', displayName: 'App Two' } }] },
      ];
      const rows = Spns.extractSiteAppPermissions(perms);
      eq(rows.length, 2);
      eq(rows[0], { permissionId: 'p1', appId: 'app-1', displayName: 'App One', roles: ['read'] });
      eq(rows[1].roles, ['write', 'read']);
    });
    test('extractSiteAppPermissions: falls back to grantedToIdentities and skips non-app', () => {
      const perms = [
        { id: 'p1', roles: ['read'], grantedToIdentities: [{ application: { id: 'app-1' } }] },
        { id: 'p2', roles: ['read'], grantedToIdentitiesV2: [{ user: { id: 'u1' } }] },
      ];
      const rows = Spns.extractSiteAppPermissions(perms);
      eq(rows.length, 1);
      eq(rows[0].appId, 'app-1');
      eq(rows[0].displayName, '');
    });
    test('findAppPermissionOnSite: matches by appId case-insensitively', () => {
      const perms = [{ id: 'p1', roles: ['write'], grantedToIdentitiesV2: [{ application: { id: 'AAA-Bbb', displayName: 'X' } }] }];
      eq(Spns.findAppPermissionOnSite(perms, 'aaa-bbb').permissionId, 'p1');
      eq(Spns.findAppPermissionOnSite(perms, 'nope'), null);
      eq(Spns.findAppPermissionOnSite(perms, null), null);
    });

    // Shared auth helpers this tool relies on
    test('ToolkitAuth.parseAuthFile: parses key:value lines', () => {
      const cfg = ToolkitAuth.parseAuthFile('clientId:abc\nredirect-url-local: http://localhost:1985\nredirect-url-web: https://example.com\n# comment\n');
      eq(cfg.clientId, 'abc');
      eq(cfg['redirect-url-local'], 'http://localhost:1985');
      eq(cfg['redirect-url-web'], 'https://example.com');
    });
    test('ToolkitAuth.pickRedirectUriForOrigin: local vs web', () => {
      const cfg = { 'redirect-url-local': 'http://localhost:1985', 'redirect-url-web': 'https://x.example.com' };
      eq(ToolkitAuth.pickRedirectUriForOrigin(cfg, 'http://localhost:1985'), 'http://localhost:1985');
      eq(ToolkitAuth.pickRedirectUriForOrigin(cfg, 'https://x.example.com'), 'https://x.example.com');
    });

    // API picker: by appId, no substring fallback
    const GRAPH = { id: 'o1', appId: Spns.GRAPH_APP_ID, displayName: 'Microsoft Graph', appOwnerOrganizationId: Spns.MS_FIRST_PARTY_TENANT };
    const TWIN_A = { id: 'o2', appId: '11111111-1111-1111-1111-111111111111', displayName: 'Contoso API', appOwnerOrganizationId: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa' };
    const TWIN_B = { id: 'o3', appId: '22222222-2222-2222-2222-222222222222', displayName: 'Contoso API', publisherName: 'Evil Corp', appOwnerOrganizationId: 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb' };
    const APIS = [GRAPH, TWIN_A, TWIN_B];
    test('apiOptionLabel: name plus appId', () => {
      eq(Spns.apiOptionLabel(GRAPH), `Microsoft Graph (${Spns.GRAPH_APP_ID})`);
    });
    test('resolveApiQuery: option label resolves by appId', () => {
      eq(Spns.resolveApiQuery(APIS, Spns.apiOptionLabel(TWIN_B)).sp.id, 'o3');
      eq(Spns.resolveApiQuery(APIS, Spns.apiOptionLabel(TWIN_A)).sp.id, 'o2');
    });
    test('resolveApiQuery: bare appId and unique exact name', () => {
      eq(Spns.resolveApiQuery(APIS, Spns.GRAPH_APP_ID.toUpperCase()).sp.id, 'o1');
      eq(Spns.resolveApiQuery(APIS, '  microsoft graph ').sp.id, 'o1');
    });
    test('resolveApiQuery: duplicate names are refused', () => {
      const r = Spns.resolveApiQuery(APIS, 'Contoso API');
      eq(r.sp, undefined);
      eq(r.matches.length, 2);
    });
    test('resolveApiQuery: no substring matching', () => {
      eq(Spns.resolveApiQuery(APIS, 'Graph').sp, undefined);
      eq(Spns.resolveApiQuery(APIS, 'Contoso').sp, undefined);
      eq(Spns.resolveApiQuery(APIS, '').sp, undefined);
    });
    test('resolveApiQuery: unknown appId in label is refused', () => {
      eq(Spns.resolveApiQuery(APIS, 'Microsoft Graph (99999999-9999-9999-9999-999999999999)').sp, undefined);
    });
    test('ownerLabel: Microsoft, own tenant, publisher', () => {
      eq(Spns.ownerLabel(GRAPH, 't'), 'Microsoft');
      eq(Spns.ownerLabel(TWIN_A, 'AAAAAAAA-aaaa-aaaa-aaaa-aaaaaaaaaaaa'), 'your tenant');
      eq(Spns.ownerLabel(TWIN_B, 'x'), 'Evil Corp, tenant bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb');
      eq(Spns.ownerLabel(null), 'unknown owner');
    });

    // Tenant guard
    const b64u = (o) => btoa(JSON.stringify(o)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const jwt = (claims) => `${b64u({ alg: 'none' })}.${b64u(claims)}.sig`;
    test('tokenTenantId: reads tid from a JWT, null otherwise', () => {
      eq(Spns.tokenTenantId(jwt({ tid: 'tenant-1', name: 'Zoë ÿ' })), 'tenant-1');
      eq(Spns.tokenTenantId('opaque-token'), null);
      eq(Spns.tokenTenantId(null), null);
    });
    test('assertTokenTenant: throws on another tenant', () => {
      let threw = false;
      try { Spns.assertTokenTenant(jwt({ tid: 'customer' }), 'own'); } catch { threw = true; }
      eq(threw, true);
    });
    test('assertTokenTenant: passes same tenant (any case), unpinned, or opaque token', () => {
      Spns.assertTokenTenant(jwt({ tid: 'ABC' }), 'abc');
      Spns.assertTokenTenant(jwt({ tid: 'x' }), null);
      Spns.assertTokenTenant('opaque', 'abc');
    });

    // SharePoint URL validation
    test('isSharePointHost: only *.sharepoint.com', () => {
      eq(Spns.isSharePointHost('contoso.sharepoint.com'), true);
      eq(Spns.isSharePointHost('contoso-my.sharepoint.com'), true);
      eq(Spns.isSharePointHost('sharepoint.com'), false);
      eq(Spns.isSharePointHost('contoso.sharepoint.com.evil.net'), false);
      eq(Spns.isSharePointHost('evilsharepoint.com'), false);
      eq(Spns.isSharePointHost('graph.microsoft.com'), false);
    });
    test('siteCollectionPath: collection of a deep URL, segments encoded', () => {
      eq(Spns.siteCollectionPath('https://contoso.sharepoint.com/sites/Marketing/Sub/Shared%20Documents/x.aspx'), '/sites/contoso.sharepoint.com:/sites/Marketing');
      eq(Spns.siteCollectionPath('https://contoso.sharepoint.com/sites/R%26D%20Team'), '/sites/contoso.sharepoint.com:/sites/R%26D%20Team');
      eq(Spns.siteCollectionPath('https://contoso.sharepoint.com/'), '/sites/contoso.sharepoint.com');
    });
    test('siteCollectionPath: rejects other hosts and schemes', () => {
      eq(Spns.siteCollectionPath('http://contoso.sharepoint.com/sites/a'), null);
      eq(Spns.siteCollectionPath('https://contoso.sharepoint.com.evil.net/sites/a'), null);
      eq(Spns.siteCollectionPath('https://user:pw@contoso.sharepoint.com/sites/a'), null);
      eq(Spns.siteCollectionPath('https://contoso.sharepoint.com:8443/sites/a'), null);
      eq(Spns.siteCollectionPath('javascript:alert(1)'), null);
      eq(Spns.siteCollectionPath('Marketing'), null);
      eq(Spns.siteCollectionPath('https://contoso.sharepoint.com/sites/%E0%A4%A'), null);
    });
    test('siteCollectionPath: path traversal stays encoded', () => {
      eq(Spns.siteCollectionPath('https://contoso.sharepoint.com/sites/a%2F..%2F..%2Fusers'), '/sites/contoso.sharepoint.com:/sites/a%2F..%2F..%2Fusers');
    });
    test('isValidSiteId: host,guid,guid on SharePoint Online', () => {
      const g = '0f0e0d0c-0b0a-0908-0706-050403020100';
      eq(Spns.isValidSiteId(`contoso.sharepoint.com,${g},${g}`), true);
      eq(Spns.isValidSiteId(`evil.net,${g},${g}`), false);
      eq(Spns.isValidSiteId(`contoso.sharepoint.com,${g}`), false);
      eq(Spns.isValidSiteId(`contoso.sharepoint.com,${g},${g}/../../users`), false);
      eq(Spns.isValidSiteId(null), false);
    });

    // Confirm dialog content
    test('confirmFacts: tenant, service principal, API, site', () => {
      const rows = Spns.confirmFacts({
        tenant: { domain: 'contoso.com', tenantId: 'tid-1' },
        spn: { displayName: 'Backup app', appId: 'app-1' },
        api: GRAPH,
        site: { displayName: 'HR', webUrl: 'https://contoso.sharepoint.com/sites/hr' },
      });
      eq(rows.map((r) => r[0]), ['Tenant', 'Service principal', 'API', 'Site']);
      eq(rows[0][1], 'contoso.com (tid-1)');
      eq(rows[1][1], 'Backup app (appId app-1)');
      eq(rows[2][1], `Microsoft Graph (appId ${Spns.GRAPH_APP_ID}), owned by Microsoft`);
      eq(rows[3][1], 'HR (https://contoso.sharepoint.com/sites/hr)');
    });
    test('confirmFacts: tenant row even when not signed in', () => {
      eq(Spns.confirmFacts({ tenant: null }), [['Tenant', '(not signed in)']]);
    });
    test('revokeAllItems: one line per assignment and grant', () => {
      const rc = new Map([['res-graph', { displayName: 'Microsoft Graph', appId: Spns.GRAPH_APP_ID }]]);
      const ric = new Map([['res-graph', new Map([['role-1', { name: 'User.Read.All' }]])]]);
      const items = Spns.revokeAllItems(
        [{ resourceId: 'res-graph', appRoleId: 'role-1' }, { resourceId: 'res-x', appRoleId: 'role-9', resourceDisplayName: 'Other' }],
        [{ resourceId: 'res-graph', scope: 'Mail.Read User.Read', consentType: 'AllPrincipals' }, { resourceId: 'res-graph', scope: '', consentType: 'Principal', principalId: 'u1' }],
        rc, ric);
      eq(items, [
        'Remove application permission Microsoft Graph: User.Read.All',
        'Remove application permission Other: role-9',
        'Remove delegated grant Microsoft Graph: Mail.Read User.Read (all users)',
        'Remove delegated grant Microsoft Graph: (no scopes) (user u1)',
      ]);
    });

    // bulk revoke of delegated scopes
    test('planScopeRevocation: patch partial, delete full and scopeless grants', () => {
      const grants = [
        { id: 'g1', scope: 'Mail.Read User.Read Files.Read' },
        { id: 'g2', scope: 'Sites.Read.All' },
        { id: 'g3', scope: '' },
        { id: 'g4', scope: 'Calendars.Read' },
      ];
      const sel = new Set([Spns.scopeKey('g1', 'Mail.Read'), Spns.scopeKey('g1', 'Files.Read'), Spns.scopeKey('g2', 'Sites.Read.All'), Spns.scopeKey('g3', '')]);
      const plan = Spns.planScopeRevocation(grants, sel);
      eq(plan.map((p) => [p.grant.id, p.action, p.remove, p.keep]), [
        ['g1', 'update', ['Mail.Read', 'Files.Read'], ['User.Read']],
        ['g2', 'delete', ['Sites.Read.All'], []],
        ['g3', 'delete', [], []],
      ]);
    });
    test('planScopeRevocation: nothing selected, nothing planned', () => {
      eq(Spns.planScopeRevocation([{ id: 'g1', scope: 'Mail.Read' }], new Set()), []);
    });

    // Exchange hint
    test('hasMailboxPermissions: Graph Mail.Read and any Exchange role count, User.Read.All does not', () => {
      const rc = new Map([['g', { appId: Spns.GRAPH_APP_ID }], ['x', { appId: Spns.EXO_APP_ID }]]);
      const ric = new Map([['g', new Map([['r1', { name: 'Mail.Read' }], ['r2', { name: 'User.Read.All' }]])], ['x', new Map()]]);
      eq(Spns.hasMailboxPermissions([{ resourceId: 'g', appRoleId: 'r1' }], rc, ric), true);
      eq(Spns.hasMailboxPermissions([{ resourceId: 'g', appRoleId: 'r2' }], rc, ric), false);
      eq(Spns.hasMailboxPermissions([{ resourceId: 'x', appRoleId: 'whatever' }], rc, ric), true);
      eq(Spns.hasMailboxPermissions([], rc, ric), false);
    });

    // site list
    test('siteKey: collection URL, lowercase, subsites and libraries collapse', () => {
      eq(Spns.siteKey('https://Contoso.sharepoint.com/sites/HR/Shared%20Documents/x.docx'), 'https://contoso.sharepoint.com/sites/hr');
      eq(Spns.siteKey('https://contoso.sharepoint.com/'), 'https://contoso.sharepoint.com');
      eq(Spns.siteKey('https://evil.example.com/sites/hr'), null);
    });
    const SITES = [
      { displayName: 'Human Resources', webUrl: 'https://contoso.sharepoint.com/sites/HR' },
      { displayName: 'Marketing EMEA', webUrl: 'https://contoso.sharepoint.com/sites/mkt-emea' },
      { displayName: 'Project Falcon', webUrl: 'https://contoso.sharepoint.com/teams/falcon' },
    ];
    test('filterSites: partial words on name and URL, every word must match', () => {
      eq(Spns.filterSites(SITES, 'sourc').map((s) => s.displayName), ['Human Resources']);
      eq(Spns.filterSites(SITES, 'mkt').map((s) => s.displayName), ['Marketing EMEA']);
      eq(Spns.filterSites(SITES, 'teams falc').map((s) => s.displayName), ['Project Falcon']);
      eq(Spns.filterSites(SITES, 'marketing falcon'), []);
      eq(Spns.filterSites(SITES, '*').length, 3);
      eq(Spns.filterSites(SITES, '').length, 3);
    });
    test('filterSites: a pasted URL matches its site collection', () => {
      eq(Spns.filterSites(SITES, 'https://contoso.sharepoint.com/sites/hr/Lists/Tasks').map((s) => s.displayName), ['Human Resources']);
    });
    test('sortSitesByAccess: sites with access first, original order otherwise', () => {
      const access = new Map([['https://contoso.sharepoint.com/teams/falcon', { status: 'yes', roles: ['read'] }], ['https://contoso.sharepoint.com/sites/hr', { status: 'denied' }]]);
      eq(Spns.sortSitesByAccess(SITES, access).map((s) => s.displayName), ['Project Falcon', 'Human Resources', 'Marketing EMEA']);
    });
    test('isAccessDenied: 401, 403 and accessDenied code', () => {
      eq(Spns.isAccessDenied({ status: 403 }), true);
      eq(Spns.isAccessDenied({ status: 401 }), true);
      eq(Spns.isAccessDenied({ status: 400, code: 'accessDenied' }), true);
      eq(Spns.isAccessDenied({ status: 404 }), false);
      eq(Spns.isAccessDenied(null), false);
    });
    test('sitePermsForRemoval: one entry per permission, all its apps', () => {
      const perms = [
        { id: 'p1', roles: ['read'], grantedToIdentitiesV2: [{ application: { id: 'a1', displayName: 'One' } }, { application: { id: 'a2', displayName: 'Two' } }] },
        { id: 'p2', roles: ['write'], grantedToIdentitiesV2: [{ application: { id: 'a3', displayName: 'Three' } }] },
      ];
      eq(Spns.sitePermsForRemoval(perms, new Set(['p1'])), [{ permissionId: 'p1', apps: [{ appId: 'a1', displayName: 'One' }, { appId: 'a2', displayName: 'Two' }], roles: ['read'] }]);
      eq(Spns.sitePermsForRemoval(perms, new Set()), []);
    });

    // SharePoint admin
    test('adminHostOf: tenant, -my and -admin hosts; anything else null', () => {
      eq(Spns.adminHostOf('Contoso.sharepoint.com'), 'contoso-admin.sharepoint.com');
      eq(Spns.adminHostOf('contoso-my.sharepoint.com'), 'contoso-admin.sharepoint.com');
      eq(Spns.adminHostOf('contoso-admin.sharepoint.com'), 'contoso-admin.sharepoint.com');
      eq(Spns.adminHostOf('contoso.sharepoint.com.evil.com'), null);
      eq(Spns.adminHostOf(''), null);
    });
    test('claimLoginName: adds the membership claim once', () => {
      eq(Spns.claimLoginName('jo@contoso.com'), 'i:0#.f|membership|jo@contoso.com');
      eq(Spns.claimLoginName('i:0#.f|membership|jo@contoso.com'), 'i:0#.f|membership|jo@contoso.com');
      let threw = false;
      try { Spns.claimLoginName(''); } catch { threw = true; }
      eq(threw, true);
    });

    // temporary site admin records
    test('elevations: add replaces, drop removes, filtered per account', () => {
      let list = [];
      list = Spns.addElevation(list, { siteUrl: 'https://contoso.sharepoint.com/sites/HR/', upn: 'Jo@contoso.com', tenantId: 'T1', at: 'a' });
