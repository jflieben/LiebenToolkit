<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DupedDevices - tests</title>
  <style>
    body { font: 14px/1.4 -apple-system,Segoe UI,sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
    .pass { color: #1f7a3a; } .fail { color: #b32026; font-weight: bold; }
    .group { margin-top: 14px; font-weight: 600; }
    pre { background: #f4f4f6; padding: 10px; border-radius: 6px; overflow: auto; }
    h1 { font-size: 18px; }
  </style>
</head>
<body>
  <h1>DupedDevices - unit tests</h1>
  <div id="out"></div>
  <script src="../../shared/log.js"></script>
  <script src="../../shared/concurrency.js"></script>
  <script src="../../shared/http.js"></script>
  <script src="../../shared/export.js"></script>
  <script src="../src/devices.js"></script>
  <script>
    const out = document.getElementById('out');
    const queue = [];
    function group(name) { queue.push({ group: name }); }
    function test(name, fn) { queue.push({ name, fn }); }
    function eq(a, b, m = '') {
      const A = JSON.stringify(a), B = JSON.stringify(b);
      if (A !== B) throw new Error(`${m} expected ${B}, got ${A}`);
    }
    function truthy(v, m) { if (!v) throw new Error(m || `expected truthy, got ${v}`); }

    const NOW = new Date('2026-01-01T00:00:00Z');
    const DAY = 86400000;
    const ago = (days) => new Date(NOW.getTime() - days * DAY);
    const stamp = (days) => Devices.buildDisableStampValue(ago(days));
    function dev(id, hwid, opts = {}) {
      return {
        id, deviceId: 'dev-' + id, displayName: opts.name || ('dev-' + id),
        physicalIds: hwid ? ['[HWID]:' + hwid].concat(opts.ztd ? ['[ZTDId]:x'] : []) : [],
        accountEnabled: !opts.disabled,
        approximateLastSignInDateTime: opts.lastSignIn || null,
        createdDateTime: opts.created || null,
        operatingSystem: opts.os || 'Windows',
        operatingSystemVersion: opts.ver || '',
        isAutopilot: !!opts.ztd,
      };
    }

    group('extractHwid');
    test('null without physicalIds', () => {
      eq(Devices.extractHwid({}), null);
      eq(Devices.extractHwid({ physicalIds: [] }), null);
    });
    test('null with only GID entries', () => {
      eq(Devices.extractHwid({ physicalIds: ['[GID]:abc', '[USER-GID]:user1:foo'] }), null);
    });
    test('plain [HWID]', () => eq(Devices.extractHwid({ physicalIds: ['[HWID]:hardware-aaa'] }), 'hardware-aaa'));
    test('last token of [USER-HWID]', () => eq(Devices.extractHwid({ physicalIds: ['[USER-HWID]:userA:hwid-bbb'] }), 'hwid-bbb'));
    test('[HWID] wins over [USER-HWID]', () => {
      eq(Devices.extractHwid({ physicalIds: ['[USER-HWID]:userA:hwid-bbb', '[HWID]:hardware-aaa'] }), 'hardware-aaa');
    });
    test('ignores non-string entries', () => eq(Devices.extractHwid({ physicalIds: [null, 5, '[HWID]:hwx'] }), 'hwx'));

    group('Autopilot');
    test('buildManagedMap indexes by azureADDeviceId, case-insensitive', () => {
      const map = Devices.buildManagedMap([{ azureADDeviceId: 'ABC-123' }, { azureADDeviceId: '' }]);
      eq(map.has('abc-123'), true);
      eq(map.size, 1);
    });
    test('isAutopilot: Intune flag first, [ZTDId] fallback', () => {
      eq(Devices.isAutopilot({}, { autopilotEnrolled: true }), true);
      eq(Devices.isAutopilot({}, { autopilotEnrolled: false }), false);
      eq(Devices.isAutopilot({ physicalIds: ['[ZTDId]:123'] }, null), true);
      eq(Devices.isAutopilot({ physicalIds: ['[HWID]:abc'] }, null), false);
    });

    group('findDuplicates');
    test('single devices are not groups', () => eq(Devices.findDuplicates([dev('a', 'hw1'), dev('b', 'hw2')]).length, 0));
    test('groups on HWID, most recent is current', () => {
      const g = Devices.findDuplicates([
        dev('a', 'hw1', { lastSignIn: '2024-01-01T00:00:00Z' }),
        dev('b', 'hw1', { lastSignIn: '2024-06-01T00:00:00Z' }),
      ]);
      eq(g.length, 1);
      eq(g[0].current.id, 'b');
      eq(g[0].stale.map((d) => d.id), ['a']);
    });
    test('disabled devices ignored by default', () => {
      eq(Devices.findDuplicates([dev('a', 'hw1', { disabled: true }), dev('b', 'hw1')]).length, 0);
    });
    test('disabled devices included on request', () => {
      const g = Devices.findDuplicates([
        dev('a', 'hw1', { lastSignIn: '2024-01-01T00:00:00Z', disabled: true }),
        dev('b', 'hw1', { lastSignIn: '2024-06-01T00:00:00Z' }),
      ], { includeDisabledInComparison: true });
      eq(g[0].stale[0].id, 'a');
    });
    test('falls back to createdDateTime, null is oldest', () => {
      eq(Devices.findDuplicates([dev('a', 'hw1', { created: '2024-01-01T00:00:00Z' }), dev('b', 'hw1', { created: '2024-06-01T00:00:00Z' })])[0].current.id, 'b');
      eq(Devices.findDuplicates([dev('a', 'hw1'), dev('b', 'hw1', { lastSignIn: '2024-06-01T00:00:00Z' })])[0].current.id, 'b');
    });

    group('filtering and selection');
    const groups = Devices.findDuplicates([
      dev('a1', 'hw1', { name: 'LAPTOP-1', lastSignIn: '2024-01-01T00:00:00Z' }),
      dev('a2', 'hw1', { name: 'LAPTOP-1', lastSignIn: '2024-06-01T00:00:00Z' }),
      dev('b1', 'hw2', { name: 'KIOSK', ztd: true, lastSignIn: '2024-01-01T00:00:00Z' }),
      dev('b2', 'hw2', { name: 'KIOSK', lastSignIn: '2024-06-01T00:00:00Z' }),
    ]);
    test('mixed Autopilot group detection', () => {
      eq(groups.map(Devices.isMixedAutopilotGroup).sort(), [false, true]);
    });
    test('filterGroups: hide mixed and search', () => {
      eq(Devices.filterGroups(groups, { hideMixedAutopilot: true }).map((g) => g.hwid), ['hw1']);
      eq(Devices.filterGroups(groups, { search: 'kiosk' }).map((g) => g.hwid), ['hw2']);
      eq(Devices.filterGroups(groups, { search: 'HW1' }).map((g) => g.hwid), ['hw1']);
      eq(Devices.filterGroups(groups, {}).length, 2);
    });
    test('staleIds never contains the current device', () => {
      eq([...Devices.staleIds(groups)].sort(), ['a1', 'b1']);
    });
    test('trimSelection drops selections hidden by the filter', () => {
      const sel = new Set(['a1', 'b1', 'a2']);
      const visible = Devices.filterGroups(groups, { hideMixedAutopilot: true });
      eq(Devices.trimSelection(sel, Devices.staleIds(visible)), 2);
      eq([...sel], ['a1']);
    });

    group('grace period');
    test('stamp roundtrip', () => {
      const v = Devices.buildDisableStampValue(NOW);
      eq(v, 'DupedDevices:disabled:2026-01-01T00:00:00.000Z');
      eq(Devices.parseDupedDevicesStamp(v).toISOString(), NOW.toISOString());
    });
    test('foreign or broken stamps are ignored', () => {
      eq(Devices.parseDupedDevicesStamp(null), null);
      eq(Devices.parseDupedDevicesStamp('2025-01-01T00:00:00Z'), null);
      eq(Devices.parseDupedDevicesStamp('InactiveDevices:disabled:2025-01-01T00:00:00Z'), null);
      eq(Devices.parseDupedDevicesStamp('DupedDevices:disabled:not-a-date'), null);
    });
    test('parseGraceDays refuses 0, negatives, fractions and junk', () => {
      eq(Devices.parseGraceDays('0'), null);
      eq(Devices.parseGraceDays(0), null);
      eq(Devices.parseGraceDays('-5'), null);
      eq(Devices.parseGraceDays('1.5'), null);
      eq(Devices.parseGraceDays(''), null);
      eq(Devices.parseGraceDays('abc'), null);
      eq(Devices.parseGraceDays('3651'), null);
      eq(Devices.parseGraceDays('1'), 1);
      eq(Devices.parseGraceDays(' 30 '), 30);
      eq(Devices.parseGraceDays(3650), 3650);
    });
    test('findExpiredDisabled: disabled, own stamp, past grace only', () => {
      const devices = [
        { id: '1', accountEnabled: false, extensionAttributes: { extensionAttribute1: stamp(60) } },
        { id: '2', accountEnabled: false, extensionAttributes: { extensionAttribute1: stamp(5) } },
        { id: '3', accountEnabled: true, extensionAttributes: { extensionAttribute1: stamp(60) } },
        { id: '4', accountEnabled: false, extensionAttributes: {} },
        { id: '5', accountEnabled: false, extensionAttributes: { extensionAttribute1: '2020-01-01T00:00:00Z' } },
        { id: '6', accountEnabled: false, extensionAttributes: { extensionAttribute1: stamp(30) } },
      ];
      const r = Devices.findExpiredDisabled(devices, 'extensionAttribute1', 30, NOW);
      eq(r.map((e) => e.device.id), ['1', '6']);
      eq(r[0].daysDisabled, 60);
      eq(r[0].stampValue, stamp(60));
    });
    test('findExpiredDisabled: grace 0 or no attribute finds nothing', () => {
      const devices = [{ id: '1', accountEnabled: false, extensionAttributes: { extensionAttribute1: stamp(0) } }];
      eq(Devices.findExpiredDisabled(devices, 'extensionAttribute1', 0, NOW).length, 0);
      eq(Devices.findExpiredDisabled(devices, '', 30, NOW).length, 0);
    });
    test('recheckExpired: only a still-disabled device with the same expired stamp passes', () => {
      const attr = 'extensionAttribute3';
      const v = stamp(40);
      const cutoff = NOW.getTime() - 30 * DAY;
      eq(Devices.recheckExpired({ accountEnabled: false, extensionAttributes: { [attr]: v } }, attr, v, cutoff), { ok: true });
      eq(Devices.recheckExpired(null, attr, v, cutoff).ok, false);
      eq(Devices.recheckExpired({ accountEnabled: true, extensionAttributes: { [attr]: v } }, attr, v, cutoff).ok, false);
      eq(Devices.recheckExpired({ accountEnabled: false, extensionAttributes: { [attr]: stamp(1) } }, attr, v, cutoff).ok, false);
      eq(Devices.recheckExpired({ accountEnabled: false, extensionAttributes: { [attr]: null } }, attr, v, cutoff).ok, false);
      eq(Devices.recheckExpired({ accountEnabled: false, extensionAttributes: { [attr]: stamp(10) } }, attr, stamp(10), cutoff).ok, false);
    });

    group('display and export');
    test('describe lists name, OS and last activity', () => {
      eq(Devices.describe(dev('x', 'h', { name: 'PC-1', os: 'Windows', ver: '10.0', lastSignIn: '2025-03-04T10:00:00Z' })), 'PC-1  |  Windows 10.0  |  last active 2025-03-04');
      eq(Devices.describe({}), '(no name)  |  unknown OS  |  never active');
    });
    test('rowsFromGroups marks keep and stale', () => {
      const rows = Devices.rowsFromGroups(Devices.filterGroups(groups, { hideMixedAutopilot: true }), '');
      eq(rows.map((r) => `${r.id}:${r.role}`), ['a2:Keep', 'a1:Stale']);
    });
    test('export neutralises formulas in device names', () => {
      const rows = Devices.rowsFromGroups([{ hwid: 'h', deviceCount: 2, current: null, devices: [dev('x', 'h', { name: '=HYPERLINK("http://evil")' })] }], '');
      const t = Export.table(rows, [{ key: 'displayName', label: 'Name' }]);
      eq(t.body[0][0], `'=HYPERLINK("http://evil")`);
    });
    test('object ids are checked before they go into a URL', () => {
      eq(Http.isGuid('7c06cd31-7c30-4f3b-a5c3-444cd8dd63ac'), true);
      eq(Http.isGuid('../users/x'), false);
    });

    group('Concurrency');
    test('pmap keeps at most N in flight', async () => {
      let inflight = 0, peak = 0;
      await Concurrency.pmap(Array.from({ length: 20 }, (_, i) => i), async () => {
        inflight++; peak = Math.max(peak, inflight);
        await new Promise((r) => setTimeout(r, 5));
        inflight--;
      }, { concurrency: 4 });
      truthy(peak <= 4 && peak > 1, `peak was ${peak}`);
    });

    (async () => {
      let pass = 0, fail = 0;
      for (const t of queue) {
        if (t.group) { out.insertAdjacentHTML('beforeend', `<div class="group">${t.group}</div>`); continue; }
        try { await t.fn(); out.insertAdjacentHTML('beforeend', `<div class="pass">PASS ${t.name}</div>`); pass++; }
        catch (e) { out.insertAdjacentHTML('beforeend', `<div class="fail">FAIL ${t.name}<br><pre>${e.stack || e.message}</pre></div>`); fail++; }
      }
      out.insertAdjacentHTML('beforeend', `<h2>${pass} passed, ${fail} failed</h2><p id="result">TEST-RESULT: ${fail ? 'FAIL' : 'PASS'} ${pass}/${pass + fail}</p>`);
    })();
  </script>
</body>
</html>
