<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DupedDevices tests</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    .test { padding: 6px 10px; margin: 3px 0; border-radius: 6px; }
    .pass { background: #d6f3e3; color: #1f6e3a; }
    .fail { background: #fde2e1; color: #b3261e; }
    .group { margin-top: 18px; font-weight: 600; }
    pre { background: #f4f6fa; padding: 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>DupedDevices unit tests</h1>
  <div id="results"></div>

  <!-- Stub Log used by some modules -->
  <script>
    window.Log = { dbg(){}, info(){}, warn(){}, err(){}, clear(){}, setVerbose(){} };
  </script>
  <script src="../src/concurrency.js"></script>
  <script src="../src/devices.js"></script>
  <script>
    const root = document.getElementById('results');
    let pass = 0, fail = 0;
    function group(name) { const d = document.createElement('div'); d.className = 'group'; d.textContent = name; root.appendChild(d); }
    function it(name, fn) {
      const d = document.createElement('div');
      try {
        fn();
        d.className = 'test pass'; d.textContent = 'PASS - ' + name; pass++;
      } catch (e) {
        d.className = 'test fail';
        d.innerHTML = 'FAIL - ' + name + '<br><pre>' + (e.stack || e.message) + '</pre>';
        fail++;
      }
      root.appendChild(d);
    }
    function eq(a, b, msg) {
      const sa = JSON.stringify(a), sb = JSON.stringify(b);
      if (sa !== sb) throw new Error((msg ? msg + ' - ' : '') + 'expected ' + sb + ', got ' + sa);
    }
    function truthy(v, msg) { if (!v) throw new Error(msg || 'expected truthy, got ' + v); }
    function falsy(v, msg) { if (v) throw new Error(msg || 'expected falsy, got ' + v); }

    // ---------------- extractHwid ----------------
    group('extractHwid');
    it('returns null when no physicalIds', () => {
      eq(Devices.extractHwid({}), null);
      eq(Devices.extractHwid({ physicalIds: [] }), null);
    });
    it('returns null when only USER-GID / GID entries', () => {
      eq(Devices.extractHwid({ physicalIds: ['[GID]:abc', '[USER-GID]:user1:foo'] }), null);
    });
    it('extracts plain [HWID] value', () => {
      eq(Devices.extractHwid({ physicalIds: ['[HWID]:hardware-aaa'] }), 'hardware-aaa');
    });
    it('extracts last token from [USER-HWID]', () => {
      eq(Devices.extractHwid({ physicalIds: ['[USER-HWID]:userA:hwid-bbb'] }), 'hwid-bbb');
    });
    it('prefers [HWID] over USER-HWID when both present', () => {
      eq(Devices.extractHwid({ physicalIds: ['[USER-HWID]:userA:hwid-bbb', '[HWID]:hardware-aaa'] }), 'hardware-aaa');
    });
    it('ignores non-string entries', () => {
      eq(Devices.extractHwid({ physicalIds: [null, 5, '[HWID]:hwx'] }), 'hwx');
    });

    // ---------------- Autopilot helpers ----------------
    group('Autopilot helpers');
    it('buildManagedMap indexes by azureADDeviceId', () => {
      const map = Devices.buildManagedMap([
        { azureADDeviceId: 'ABC-123', userPrincipalName: 'u1@contoso.com' },
        { azureADDeviceId: 'DEF-456', userPrincipalName: 'u2@contoso.com' },
      ]);
      eq(!!map.get('abc-123'), true);
      eq(!!map.get('def-456'), true);
      eq(!!map.get('zzz'), false);
    });
    it('isAutopilot uses managed.autopilotEnrolled when available', () => {
      eq(Devices.isAutopilot({}, { autopilotEnrolled: true }), true);
      eq(Devices.isAutopilot({}, { autopilotEnrolled: false }), false);
    });
    it('isAutopilot falls back to [ZTDId] marker', () => {
      eq(Devices.isAutopilot({ physicalIds: ['[ZTDId]:123'] }, null), true);
      eq(Devices.isAutopilot({ physicalIds: ['[HWID]:abc'] }, null), false);
    });

    // ---------------- findDuplicates ----------------
    group('findDuplicates');
    function dev(id, hwid, opts = {}) {
      return {
        id, deviceId: 'dev-' + id, displayName: opts.name || ('dev-' + id),
        physicalIds: hwid ? ['[HWID]:' + hwid] : [],
        accountEnabled: opts.disabled ? false : true,
        approximateLastSignInDateTime: opts.lastSignIn || null,
        createdDateTime: opts.created || null,
        operatingSystem: opts.os || 'Windows',
      };
    }
    it('skips groups with only 1 device', () => {
      const groups = Devices.findDuplicates([dev('a','hw1'), dev('b','hw2')]);
      eq(groups.length, 0);
    });
    it('groups devices sharing a HWID', () => {
      const groups = Devices.findDuplicates([
        dev('a','hw1', { lastSignIn: '2024-01-01T00:00:00Z' }),
        dev('b','hw1', { lastSignIn: '2024-06-01T00:00:00Z' }),
      ]);
      eq(groups.length, 1);
      eq(groups[0].deviceCount, 2);
      eq(groups[0].current.id, 'b');
      eq(groups[0].stale.length, 1);
      eq(groups[0].stale[0].id, 'a');
    });
    it('ignores disabled devices in default mode', () => {
      const groups = Devices.findDuplicates([
        dev('a','hw1', { lastSignIn: '2024-01-01T00:00:00Z', disabled: true }),
        dev('b','hw1', { lastSignIn: '2024-06-01T00:00:00Z' }),
      ]);
      eq(groups.length, 0, 'one enabled + one disabled should not count');
    });
    it('includes disabled devices when includeDisabledInComparison=true', () => {
      const groups = Devices.findDuplicates([
        dev('a','hw1', { lastSignIn: '2024-01-01T00:00:00Z', disabled: true }),
        dev('b','hw1', { lastSignIn: '2024-06-01T00:00:00Z' }),
      ], { includeDisabledInComparison: true });
      eq(groups.length, 1);
      eq(groups[0].current.id, 'b');
      eq(groups[0].stale[0].id, 'a');
    });
    it('falls back to createdDateTime when no sign-in', () => {
      const groups = Devices.findDuplicates([
        dev('a','hw1', { created: '2024-01-01T00:00:00Z' }),
        dev('b','hw1', { created: '2024-06-01T00:00:00Z' }),
      ]);
      eq(groups[0].current.id, 'b');
    });
    it('treats null timestamps as oldest', () => {
      const groups = Devices.findDuplicates([
        dev('a','hw1'),
        dev('b','hw1', { lastSignIn: '2024-06-01T00:00:00Z' }),
      ]);
      eq(groups[0].current.id, 'b');
      eq(groups[0].stale[0].id, 'a');
    });

    // ---------------- DupedDevices stamp helpers ----------------
    group('Disable-stamp helpers');
    it('buildDisableStampValue + parseDupedDevicesStamp roundtrip', () => {
      const v = Devices.buildDisableStampValue();
      truthy(v.startsWith('DupedDevices:disabled:'));
      const d = Devices.parseDupedDevicesStamp(v);
      truthy(d instanceof Date);
      truthy(!isNaN(d.getTime()));
    });
    it('parseDupedDevicesStamp returns null for unrelated values', () => {
      eq(Devices.parseDupedDevicesStamp(null), null);
      eq(Devices.parseDupedDevicesStamp('something else'), null);
      eq(Devices.parseDupedDevicesStamp('DupedDevices:disabled:not-a-date'), null);
    });
    it('findExpiredDisabled returns past-grace devices only', () => {
      const old = new Date(Date.now() - 60 * 86400000).toISOString();
      const recent = new Date(Date.now() - 5 * 86400000).toISOString();
      const devices = [
        { id: '1', accountEnabled: false, extensionAttributes: { extensionAttribute1: 'DupedDevices:disabled:' + old } },
        { id: '2', accountEnabled: false, extensionAttributes: { extensionAttribute1: 'DupedDevices:disabled:' + recent } },
        { id: '3', accountEnabled: true,  extensionAttributes: { extensionAttribute1: 'DupedDevices:disabled:' + old } },
        { id: '4', accountEnabled: false, extensionAttributes: {} },
      ];
      // Note: findExpiredDisabled uses raw Date parse, not parseDupedDevicesStamp,
      // which still works for a full ISO string but not for our prefixed form.
      // We test the prefix-aware logic via the parse helper instead, since the app uses that.
      const expired = devices.filter(d => {
        if (d.accountEnabled !== false) return false;
        const v = (d.extensionAttributes || {}).extensionAttribute1;
        const ts = Devices.parseDupedDevicesStamp(v);
        if (!ts) return false;
        return (Date.now() - ts.getTime()) >= 30 * 86400000;
      });
      eq(expired.map(d => d.id), ['1']);
    });

    // ---------------- Concurrency ----------------
    group('Concurrency.pmap');
    it('runs at most N tasks in parallel', async () => {
      let inflight = 0, peak = 0;
      const tasks = Array.from({length: 20}, (_, i) => i);
      await Concurrency.pmap(tasks, 4, async () => {
        inflight++; peak = Math.max(peak, inflight);
        await new Promise(r => setTimeout(r, 5));
        inflight--;
      });
      truthy(peak <= 4, 'peak should be <= 4, got ' + peak);
    });

    // ---- Summary ----
    setTimeout(() => {
      const sum = document.createElement('div');
      sum.className = fail === 0 ? 'test pass' : 'test fail';
      sum.style.marginTop = '18px';
      sum.textContent = `${pass} passed, ${fail} failed`;
      root.appendChild(sum);
    }, 100);
  </script>
</body>
</html>
